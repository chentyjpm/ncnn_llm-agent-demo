name: Verify activity integration before publication
on:
  push:
    branches: [work/activity-trace-20261008]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply reviewed changes and verify every source hash
        run: python .activity-stage/apply.py
      - name: Install test dependencies only
        run: |
          python -m pip install -r requirements-office.txt -r requirements-monitor.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: All Python regressions and actual UI ordering checks
        run: |
          python scripts/run_tests.py --output-dir reports/activity-unit
          node --check local_agent/webui/activity.js
          node --check local_agent/webui/app.js
          node scripts/test_ui_lifecycle.js
      - name: Real browser with explicit model fixtures
        run: |
          python scripts/browser_activity.py --output reports/browser-activity
          python scripts/browser_web.py --output reports/activity-legacy-browser
      - name: Publish verified source to staging branch only
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('.activity-stage/manifest.json').read_text())
          subprocess.run(['git','add','--',*m['after']],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','test: assemble verified activity integration'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/work/activity-trace-20261008'],check=True)
          PY
      - name: Preserve exact tests, screenshots and source
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: activity-stage-evidence-${{ github.run_id }}
          path: |
            reports/activity-unit/
            reports/browser-activity/
            reports/activity-legacy-browser/
            .activity-stage/manifest.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
