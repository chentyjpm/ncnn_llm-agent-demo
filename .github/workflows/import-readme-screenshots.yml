name: Import README screenshot assets
on:
  push:
    branches: [docs/readme-showcase-assets-20260930]
    paths: ['.github/workflows/import-readme-screenshots.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read existing H5 acceptance screenshots
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: h5-ui-36684429497
          run-id: 36684429497
          github-token: ${{ github.token }}
          path: .readme-source/h5
      - name: Read existing Windows layout screenshots
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: native-monitor-windows-2022
          run-id: 36688043974
          github-token: ${{ github.token }}
          path: .readme-source/monitor
      - name: Read existing packaged Windows screenshot
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: installer-evidence-windows-2022
          run-id: 36688044006
          github-token: ${{ github.token }}
          path: .readme-source/installer
      - name: Verify exact PNG bytes and write provenance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          root = Path('.readme-source')
          output = Path('docs/images')
          output.mkdir(parents=True, exist_ok=True)
          sources = {
              'h5': (36684429497, 11083037112, '0b03f4351324783df1a37eacb3a86571b8233646'),
              'monitor': (36688043974, 11084017458, 'b611f8d6b4398a18467027f2b49eabb45443a93b'),
              'installer': (36688044006, 11085358036, 'b611f8d6b4398a18467027f2b49eabb45443a93b'),
          }
          images = [
              ('ui-home-dark.png', 'h5/reports/web-browser/desktop-dark.png', '7cc3a2fb64564b522fe6335e18f300b80d5e5ed87ef1ab1833351eff85a0cddc', 'Actual H5 browser capture; explicitly labelled model test fixture.'),
              ('ui-home-light.png', 'h5/reports/web-browser/desktop-light.png', 'edceea00a75422375e6c39c65f43c995a6e7dc24fd7cd868f9d0c6016ae9a7ac', 'Actual H5 browser capture; explicitly labelled model test fixture.'),
              ('ui-chat-files.png', 'h5/reports/web-browser/desktop-chat-files.png', '4a292d7fa89b33097b0a5c9357789f836be42ecca229e5becd9de878fb4d93e2', 'Actual browser and file operations; assistant replies are fixtures, not inference.'),
              ('ui-documents.png', 'h5/reports/web-documents/document-workbench.png', 'c6dc1a8fd3a8d6e47a722be8e05380aefb4863a7a59b8bdcf4144e785513ba6d', 'Actual document-workbench UI with synthetic test document text.'),
              ('ui-approval.png', 'h5/reports/web-browser/tool-approval.png', '5bcc0375de2e9ac860c50efcd7acdc328db35ad550f1f57b3d1fa483e21ccddc', 'Actual browser consent UI; proposed model actions are labelled fixtures.'),
              ('model-center-download.png', 'h5/reports/model-center-browser/download-progress.png', '6ca66a3cf205a451e3c4c609009bc7d20aeb1f4035eb8ca1867fc34d20d0e0da', 'Actual model-center UI; progress values are simulated and are not a bandwidth benchmark.'),
              ('model-center-sources.png', 'h5/reports/model-center-browser/source-and-confirmation.png', 'd5be639af424693d8fd5d6f36de046deaf16100a29d7fa548533d4bf29268016', 'Actual model-center UI with source/consent test metadata.'),
              ('monitor-overview.png', 'installer/native-monitor.png', '0eea712accfedbac2f53292f31dfff37e3cffcddf53b0ebe57e3547f9faa4d1b', 'Actual packaged Windows application and OS telemetry; no model loaded.'),
              ('monitor-gpu.png', 'monitor/layout/layout-100-0-panel.png', 'b581086780a6c32248a76ab38c74898002dfb9696ab5d9c54cdb5df62aa3e695', 'Actual Windows native UI and OS telemetry during layout tests; not GPU inference.'),
              ('monitor-processes.png', 'monitor/layout/layout-100-1-panel.png', '7f639478e35983937c29c1060d424baae73cbe2c4f314ded5ccb1e96cd6a278a', 'Actual Windows native UI and OS telemetry during layout tests; no model loaded.'),
          ]
          records = []
          for name, member, expected, scope in images:
              data = (root / member).read_bytes()
              if not (24 <= len(data) <= 2 * 1024 * 1024):
                  raise ValueError('Screenshot size invalid: ' + name)
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise ValueError('Not a PNG: ' + name)
              if hashlib.sha256(data).hexdigest() != expected:
                  raise ValueError('Screenshot checksum mismatch: ' + name)
              source, relative = member.split('/', 1)
              run, artifact, commit = sources[source]
              width, height = struct.unpack('>II', data[16:24])
              (output / name).write_bytes(data)
              records.append(dict(path=name, source_commit=commit, run_id=run, artifact_id=artifact,
                  source_member=relative, sha256=expected, bytes=len(data), width=width, height=height, scope=scope))
              print('Verified:', name, expected)
          manifest = dict(repository='chentyjpm/ncnn_llm-agent-demo', images=records,
              transform='None. Original PNG bytes, telemetry and test-fixture labels are preserved.')
          (output / 'PROVENANCE.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert len(records) == 10
          PY
      - name: Store only reviewed images on the documentation staging branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'docs/readme-showcase-assets-20260930'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/images/*.png docs/images/PROVENANCE.json
          git diff --cached --check
          git commit -m 'docs: preserve verified runtime screenshots and source manifests'
          git push origin HEAD:docs/readme-showcase-assets-20260930
