name: macOS Vulkan crash diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/macos-vulkan-diagnostics.yml', 'scripts/diagnose_macos_probe.py']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: Actual Vulkan probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: app-engine-bridge-${{ matrix.os }}
          path: build/probe-inputs/bridge
          run-id: 36646431074
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: app-engine-image-${{ matrix.os }}
          path: build/probe-inputs/image
          run-id: 36646431074
          github-token: ${{ github.token }}
      - name: Prepare actual loader and Metal driver
        run: brew install molten-vk vulkan-loader
      - name: Reproduce with original native bytes and collect crash stack
        run: python scripts/diagnose_macos_probe.py
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-vulkan-diagnostic-${{ matrix.os }}
          path: reports/macos-probe-diagnostic/
          if-no-files-found: error
          retention-days: 14
