name: Real Qwen 0.5B CPU
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen05-cpu.yml'
      - 'scripts/qwen05_*.py'
      - 'scripts/web_real_smoke.py'
      - 'model-tests/**'
      - 'tests/test_qwen05_cpu.py'
      - 'native/**'
      - 'local_agent/**'
      - 'ci/dependencies.json'
      - 'upstream-lock.json'
permissions:
  contents: read
concurrency:
  group: real-qwen05-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Read pinned native dependencies
        id: pins
        run: python scripts/ci_native.py refs --component bridge
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: futz12/ncnn_llm
          ref: ${{ steps.pins.outputs.ncnn_llm }}
          path: .ci-src/ncnn_llm
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Tencent/ncnn
          ref: ${{ steps.pins.outputs.ncnn }}
          path: .ci-src/ncnn
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nlohmann/json
          ref: ${{ steps.pins.outputs.json }}
          path: .ci-src/json
          persist-credentials: false
      - name: CPU-only conversion/reference and Office test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 transformers==4.57.3 huggingface-hub==0.36.0 safetensors==0.6.2 -r requirements-office.txt
      - name: Run tool and exporter regressions
        run: python scripts/run_tests.py --output-dir reports/qwen05/unit
      - name: Download exact official 0.5B and verify SHA-256
        run: python scripts/qwen05_export.py download --source models/official-qwen05
      - name: Convert real weights to ncnn
        run: python scripts/qwen05_export.py export --source models/official-qwen05 --output models/ncnn-qwen05
      - name: Independent official CPU reference vectors
        run: python scripts/qwen05_reference.py --source models/official-qwen05 --output reports/qwen05/reference.json
      - name: Configure locked ncnn source and bridge
        run: |
          python scripts/ci_native.py configure --component bridge
          cmake -S model-tests/native -B build/qwen05 -DCMAKE_BUILD_TYPE=Release -DNCNN_LLM_SOURCE_DIR="$PWD/.ci-src/ncnn_llm" -DAGENT_NCNN_SOURCE_DIR="$PWD/.ci-src/ncnn" -DAGENT_JSON_SOURCE_DIR="$PWD/.ci-src/json" -DNCNN_VULKAN=ON -DNCNN_SIMPLEVK=ON -DNCNN_OPENMP=ON -DNCNN_SHARED_LIB=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Compile actual C++ bridge, probe and numerical verifier
        run: cmake --build build/qwen05 --parallel 4
      - name: Compare ncnn prefill/KV against reference
        run: build/qwen05/qwen05_logits models/ncnn-qwen05 reports/qwen05/reference.json reports/qwen05/numerical.json
      - name: Actual CPU generation and file-tool workflow
        run: python scripts/qwen05_cpu_test.py --binary build/qwen05/bridge/ncnn_agent_bridge --model models/ncnn-qwen05 --output reports/qwen05/inference
      - name: Actual CPU through H5 HTTP with history
        run: python scripts/web_real_smoke.py --binary build/qwen05/bridge/ncnn_agent_bridge --model models/ncnn-qwen05 --output reports/qwen05/web-http
      - name: Auto mode with missing Vulkan driver must complete real CPU inference
        run: python scripts/web_real_smoke.py --binary build/qwen05/bridge/ncnn_agent_bridge --model models/ncnn-qwen05 --device auto --output reports/qwen05/auto-cpu-fallback
        env:
          VK_DRIVER_FILES: /nonexistent/local-agent-vulkan.json
          VK_ICD_FILENAMES: /nonexistent/local-agent-vulkan.json
      - name: Preserve current-run evidence (no weights)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: real-qwen05-cpu-${{ github.run_id }}
          path: |
            reports/qwen05/
            models/official-qwen05/SOURCE.json
            models/ncnn-qwen05/EXPORT.json
            models/ncnn-qwen05/model.json
            models/ncnn-qwen05/*.param
            build/qwen05/CMakeCache.txt
          if-no-files-found: error
          retention-days: 14
