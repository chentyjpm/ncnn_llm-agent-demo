name: Verify HF mirror integration staging
on:
  push:
    branches: [feature/hf-mirror-downloads-20261010]
    paths: ['.hf-stage/**', '.github/workflows/hf-mirror-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/feature/hf-mirror-downloads-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - name: Apply exact reviewed patch and verify every source SHA before testing
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,os
          p=pathlib.Path('.hf-stage');m=json.loads((p/'manifest.json').read_text())
          data=b''.join(f.read_bytes() for f in sorted(p.glob('*.diff')))
          assert hashlib.sha256(data).hexdigest()==m['patch_sha256'], 'Transport digest mismatch'
          path=p/'complete.patch';path.write_bytes(data)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          actual={f:hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest() for f in m['files']}
          assert actual==m['files'], 'Applied source mismatch'
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*m['files']],check=True)
          subprocess.run(['git','commit','-m','feat: apply hash-verified optional HF mirror integration on staging branch'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/hf-mirror-downloads-20261010'],check=True)
          out=pathlib.Path('reports/hf-stage');out.mkdir(parents=True,exist_ok=True)
          (out/'source-hashes.json').write_text(json.dumps(actual,indent=2))
          (out/'source-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - name: Test dependencies only
        run: python -m pip install -r requirements-office.txt -r requirements-monitor.txt playwright==1.57.0
      - name: Full deterministic regression including actual HTTP and files (models are fixtures)
        run: python scripts/run_tests.py --output-dir reports/hf-stage-unit
      - name: JavaScript syntax and actual UI lifecycle
        run: |
          node --check local_agent/webui/workbench.js
          node scripts/test_ui_lifecycle.js
      - name: Real public download routes, manifests and tensor sample (no inference)
        run: python scripts/hf_mirror_smoke.py
      - name: Browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Actual model-center browser interaction with clearly labelled model/download fixtures
        run: python scripts/browser_model_center.py --output reports/hf-stage-browser
      - name: Preserve exact tested source
        if: always()
        run: git archive --format=zip --output=hf-stage-source.zip HEAD
      - name: Preserve actual tests, downloads, screenshots and source
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hf-mirror-stage-${{ github.run_id }}
          path: |
            reports/hf-stage/
            reports/hf-stage-unit/
            reports/hf-mirror-live/
            reports/hf-stage-browser/
            hf-stage-source.zip
          retention-days: 14
          if-no-files-found: error
