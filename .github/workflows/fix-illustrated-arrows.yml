name: Normalize illustrated guide arrowheads
on:
  push:
    branches: [docs/illustrated-cover-20261001]
    paths: ['.github/workflows/fix-illustrated-arrows.yml']
permissions:
  contents: write
jobs:
  arrows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Replace ambiguous start markers with explicit vector geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('.visual-import/render_project_guides.py')
          raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='418a9ea1cd82dade928629a3467a4474b37bd1e1'
          s=raw.decode()
          old="+(' marker-start=\"url(#arrow-back)\"' if both else '')"
          assert old in s
          s=s.replace(old,'',1)
          anchor="  if label:self.text(lx,ly,label,17,TEAL,500,'middle')"
          new='''  if both:
             # Explicit geometry avoids renderer-dependent marker-start orientation.
             token=points.split(); sx=float(token[0][1:]); sy=float(token[1]); segment=token[2]
             if segment[0] not in ('H','V'): raise ValueError('Bidirectional arrows require an H/V first segment')
             target=float(segment[1:]); origin=sx if segment[0]=='H' else sy
             direction=1 if target>origin else -1
             dx=direction if segment[0]=='H' else 0; dy=direction if segment[0]=='V' else 0
             bx=sx+14*dx; by=sy+14*dy; px=-7*dy; py=7*dx
             self.parts.append(f'<path d="M{bx+px:g} {by+py:g} L{sx:g} {sy:g} L{bx-px:g} {by-py:g}" fill="none" stroke="{TEAL}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>')
            if label:self.text(lx,ly,label,17,TEAL,500,'middle')'''
          assert s.count(anchor)==1
          s=s.replace(anchor,new,1)
          out=s.encode()
          assert hashlib.sha1(b'blob '+str(len(out)).encode()+b'\0'+out).hexdigest()=='38fe19c4ab5ff35ab25cfe07771f703176876940'
          p.write_text(s)
          PY
          python .visual-import/render_project_guides.py --svg-only
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('docs/images')
          p=root/'ILLUSTRATIONS.json';m=json.loads(p.read_text())
          for f in m['files']:
              b=(root/f['path']).read_bytes();f['bytes']=len(b);f['sha256']=hashlib.sha256(b).hexdigest()
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          b=(root/'guide-modules.svg').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='1b68dc8b019b1965b29913422bb0b68210974629'
          assert 'marker-start=' not in b.decode()
          PY
      - name: Save deterministic source and diagram update on temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .visual-import/render_project_guides.py docs/images/guide-modules.svg docs/images/ILLUSTRATIONS.json
          git commit -m 'docs: make bidirectional arrows render consistently'
          git push origin HEAD:docs/illustrated-cover-20261001
