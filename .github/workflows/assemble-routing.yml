name: Assemble reviewed model routing
on:
  push:
    branches: [feat/model-catalog-image-routing]
    paths: ['maintenance/**', '.github/workflows/assemble-routing.yml']
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    if: github.ref == 'refs/heads/feat/model-catalog-image-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/model-catalog-image-routing
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: 36721194429
          pattern: inventory-*-36721194429
          merge-multiple: true
          path: .inventory
      - name: Apply reviewed patches and verify every final file SHA-256
        run: python maintenance/assemble_routing.py
      - name: Test assembled code
        run: |
          python -m pip install -r requirements-office.txt -r requirements-monitor.txt
          python scripts/run_tests.py --output-dir reports/routing-assembly
          node --check local_agent/webui/app.js
          node --check local_agent/webui/workbench.js
      - name: Commit only to the feature branch, never main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: assemble verified native model catalog and explicit image workflow'
          git push origin HEAD:feat/model-catalog-image-routing
          git rev-parse HEAD > assembled-commit.txt
          git archive --format=zip --output=assembled-source.zip HEAD
      - name: Preserve assembly evidence and exact source
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: routing-assembly-${{ github.run_id }}
          path: |
            assembly-checks.json
            assembled-commit.txt
            assembled-source.zip
            reports/routing-assembly/
          if-no-files-found: error
          retention-days: 14
