name: Real Qwen Image Turbo
on:
  workflow_dispatch:
    inputs:
      download_route:
        description: 'Explicit HF route; third-party mirror may redirect to origin/CDN'
        type: choice
        default: hf_mirror
        options: [hf_mirror, direct]
      runner:
        description: 'Hosted CPU or your preconfigured isolated Linux Vulkan runner'
        type: choice
        default: hosted-cpu
        options: [hosted-cpu, self-hosted-vulkan]
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwenimage-turbo.yml'
      - 'scripts/qwenimage_turbo_smoke.py'
      - 'local_agent/image_profiles.py'
      - 'local_agent/images.py'
      - 'local_agent/hf_download_pins.py'
      - 'tests/test_image_turbo.py'
      - 'ci/dependencies.json'
      - 'upstream-lock.json'
permissions:
  contents: read
concurrency:
  group: real-turbo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  turbo:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'self-hosted-vulkan' && fromJSON('["self-hosted","linux","x64","qwenimage-vulkan"]') || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      TURBO_DEVICE: ${{ inputs.runner == 'self-hosted-vulkan' && 'vulkan' || 'cpu' }}
      HF_ROUTE: ${{ inputs.download_route || 'hf_mirror' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13'}
      - name: Install test-only decoder and resource observer
        run: python -m pip install Pillow==12.0.0 -r requirements-monitor.txt
      - name: Turbo profile, HTTP and dependency regressions (tiny fixtures)
        run: python -m unittest tests.test_image_turbo -v
      - id: pins
        run: python scripts/ci_native.py refs --component image
      - name: Checkout exact Turbo-capable engine and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nihui/qwenimage-ncnn-vulkan
          ref: ${{ steps.pins.outputs.qwenimage }}
          path: .ci-src/qwenimage
          submodules: recursive
          persist-credentials: false
      - name: Build and preflight real image executable
        run: |
          python scripts/ci_native.py configure --component image
          python scripts/ci_native.py build --component image
          python scripts/ci_native.py smoke --component image
      - name: Download verified weights and generate actual eight-step Turbo PNG
        timeout-minutes: 105
        run: python scripts/qwenimage_turbo_smoke.py --binary build/ci-image/qwenimage-ncnn-vulkan --device "$TURBO_DEVICE" --route "$HF_ROUTE" --timeout 3600
      - name: Upload evidence and real PNG, not weights
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: real-turbo-${{ env.TURBO_DEVICE }}-${{ github.run_id }}
          path: |
            reports/turbo-real/*.json
            reports/turbo-real/*.jsonl
            reports/turbo-real/*.log
            reports/turbo-real/generated.png
            reports/ci/image/
          if-no-files-found: error
          retention-days: 14
