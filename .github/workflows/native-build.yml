name: Native C++ build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-build.yml'
      - 'native/**'
      - 'ci/**'
      - 'scripts/ci_native.py'
      - 'scripts/native_regression.py'
      - 'scripts/probe_regression.py'
      - 'local_agent/device.py'
      - 'tests/test_ci*.py'
      - 'upstream-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-build.yml'
      - 'native/**'
      - 'ci/**'
      - 'scripts/ci_native.py'
      - 'scripts/native_regression.py'
      - 'scripts/probe_regression.py'
      - 'local_agent/device.py'
      - 'tests/test_ci*.py'
      - 'upstream-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
jobs:
  native:
    name: C++ / ${{ matrix.component }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
        component: [bridge, image]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Read and validate pinned dependency commits
        id: pins
        run: python scripts/ci_native.py refs --component ${{ matrix.component }}
      - name: Checkout ncnn_llm
        if: matrix.component == 'bridge'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.pins.outputs.ncnn_llm_repository }}
          ref: ${{ steps.pins.outputs.ncnn_llm_checkout_ref }}
          path: .ci-src/ncnn_llm
          persist-credentials: false
      - name: Checkout ncnn and Vulkan compiler dependencies
        if: matrix.component == 'bridge'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Tencent/ncnn
          ref: ${{ steps.pins.outputs.ncnn }}
          path: .ci-src/ncnn
          submodules: recursive
          persist-credentials: false
      - name: Checkout JSON headers
        if: matrix.component == 'bridge'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nlohmann/json
          ref: ${{ steps.pins.outputs.json }}
          path: .ci-src/json
          persist-credentials: false
      - name: Checkout Qwen Image with pinned ncnn and codecs
        if: matrix.component == 'image'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nihui/qwenimage-ncnn-vulkan
          ref: ${{ steps.pins.outputs.qwenimage }}
          path: .ci-src/qwenimage
          submodules: recursive
          persist-credentials: false
      - name: Configure actual upstream source and matching device probe
        run: python scripts/ci_native.py configure --component ${{ matrix.component }}
      - name: Compile and link Release executable
        run: python scripts/ci_native.py build --component ${{ matrix.component }}
      - name: Install software Vulkan test driver (not hardware acceleration)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Native CLI and actual Vulkan compute preflight
        run: python scripts/ci_native.py smoke --component ${{ matrix.component }}
        env:
          LOCAL_AGENT_TEST_SOFTWARE_VK: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Package and retest engine and device probe
        run: python scripts/ci_native.py package --component ${{ matrix.component }}
      - name: Upload successfully built executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-${{ matrix.component }}-${{ matrix.os }}
          path: dist/ci/*.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Summarize current job only
        if: always()
        run: python scripts/ci_native.py summary --component ${{ matrix.component }}
      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-logs-${{ matrix.component }}-${{ matrix.os }}
          path: |
            reports/ci/${{ matrix.component }}/
            build/ci-${{ matrix.component }}/CMakeCache.txt
            build/ci-${{ matrix.component }}/CMakeFiles/CMakeConfigureLog.yaml
            build/ci-${{ matrix.component }}/Testing/Temporary/
          retention-days: 14
          if-no-files-found: warn
