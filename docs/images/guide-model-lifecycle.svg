<g transform="translate(33,-36)"><ellipse rx="7" ry="14" fill="#f3aaca" transform="rotate(-35)"/><ellipse rx="7" ry="14" fill="#f3aaca" transform="rotate(35)"/><circle r="4" fill="#ffe2a3"/></g></g><rect x="60" y="234" width="280" height="192" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="60" y="256" width="5" height="55" rx="2" fill="#488bca"/><text x="83" y="273" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">01  选择来源</text><text x="83" y="310" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">ModelScope / Hugging Face</text><text x="83" y="339" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">SDU 原生镜像（按模型）</text><path d="M342 330 H356" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="360" y="234" width="280" height="192" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="360" y="256" width="5" height="55" rx="2" fill="#d368a4"/><text x="383" y="273" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">02  清单与确认</text><text x="383" y="310" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">查询版本、大小、所需空间</text><text x="383" y="339" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">用户确认后开始下载</text><path d="M642 330 H656" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="660" y="234" width="280" height="192" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="660" y="256" width="5" height="55" rx="2" fill="#238f91"/><text x="683" y="273" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">03  下载与校验</text><text x="683" y="310" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">真实字节进度 / 文件校验</text><text x="683" y="339" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">失败不会启用半成品</text><path d="M942 330 H956" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="960" y="234" width="280" height="192" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="960" y="256" width="5" height="55" rx="2" fill="#8068bd"/><text x="983" y="273" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">04  按格式准备</text><text x="983" y="310" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">受支持 Qwen2.5：转换</text><text x="983" y="339" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">原生 ncnn 包：校验部署</text><path d="M1242 330 H1256" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1260" y="234" width="280" height="192" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="1260" y="256" width="5" height="55" rx="2" fill="#488bca"/><text x="1283" y="273" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">05  分别启用</text><text x="1283" y="310" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">当前文字模型 / 生图模型</text><text x="1283" y="339" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">READY 发布后才可使用</text><text x="60" y="465" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">生图模型目前使用已核实的 Hugging Face ncnn 来源；不支持的来源不自动替换。</text><path d="M60 499 H1540" stroke="#dce3ed" stroke-dasharray="5 8"/><rect x="60" y="523" width="215" height="32" rx="16" fill="#e9e5f6" stroke="#e9e5f6" stroke-width="1.5"/><text x="167.5" y="546" font-size="17" font-weight="600" text-anchor="middle" style="fill:#8068bd">运行时：device = auto</text><rect x="60" y="597" width="385" height="182" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="60" y="619" width="5" height="55" rx="2" fill="#488bca"/><text x="83" y="636" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">按需启动推理引擎</text><text x="83" y="673" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">文字：ncnn_llm / bridge</text><text x="83" y="702" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">生图：Qwen Image</text><text x="425" y="760" font-size="15" font-weight="600" text-anchor="end" style="fill:#488bca">分别使用匹配的设备探测器</text><path d="M725 561 L925 697 L725 833 L525 697 Z" fill="#ffffff" stroke="#c5c9e8" stroke-width="2" filter="url(#shadow)"/><text x="725" y="663" font-size="26" font-weight="700" text-anchor="middle" style="fill:#8068bd">硬件 Vulkan</text><text x="725" y="704" font-size="29" font-weight="700" text-anchor="middle" style="fill:#22304d">是否可用？</text><text x="725" y="743" font-size="18" font-weight="400" text-anchor="middle" style="fill:#64728b">设备枚举 + 小型计算预检</text><path d="M450 695 H518" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1120" y="568" width="420" height="128" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="1120" y="590" width="5" height="55" rx="2" fill="#238f91"/><text x="1143" y="607" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">优先 Vulkan</text><text x="1143" y="644" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">采用预检通过的硬件设备</text><rect x="1120" y="747" width="420" height="128" rx="20" fill="#ffffff" stroke="#dce3ed" stroke-width="1.5" filter="url(#shadow)"/><rect x="1120" y="769" width="5" height="55" rx="2" fill="#d368a4"/><text x="1143" y="786" font-size="24" font-weight="700" text-anchor="start" style="fill:#22304d">无可用硬件时 CPU</text><text x="1143" y="823" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">记录回退原因，不伪装 GPU</text><path d="M828 625 H992 V625 H1114" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1007" y="608" font-size="17" font-weight="500" text-anchor="middle" style="fill:#238f91">是</text><path d="M828 771 H995 V811 H1114" fill="none" stroke="#238f91" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1010" y="792" font-size="17" font-weight="500" text-anchor="middle" style="fill:#238f91">否</text><text x="60" y="882" font-size="20" font-weight="400" text-anchor="start" style="fill:#64728b">预检通过 ≠ 模型每一层都在 GPU 上；INT8 等路径可能包含 CPU 算子。</text><path d="M56 935 H1544" stroke="#dce3ed"/><text x="58" y="964" font-size="16" font-weight="400" text-anchor="start" style="fill:#64728b">权重损坏、内存不足、超时等运行错误，不应被无条件 CPU 重试掩盖。</text><text x="1540" y="964" font-size="15" font-weight="400" text-anchor="end" style="fill:#64728b">代码基线 cc0b067 · 架构示意，非运行截图</text></svg>